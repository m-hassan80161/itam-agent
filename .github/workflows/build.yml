name: Build Windows Installer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. سحب الكود من المستودع
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Python 3.8 is the last Python release line that supports Windows 7.
    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8.10'
        architecture: 'x86'

    # 3. تثبيت المكتبات
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m compileall -q main.py

    # 4. بناء ملف .exe وتضمين مفتاح secret.key بداخله
    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name ITAMAgent --add-data "secret.key;." main.py

    # 5. تثبيت Inno Setup عبر Chocolatey وإضافته للمسار (طريقة رسمية وآمنة 🎯)
    - name: Install Inno Setup via Chocolatey
      run: |
        choco install innosetup -y
        echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

    # 6. تجميع ملف installer.iss باستخدام ISCC مباشرة
    - name: Compile Inno Setup Script
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    # 7. رفع الملف النهائي للتنزيل
    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ITAM-Agent-Installer
        path: Output/*.exe